<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4th Place Snake</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#17210e;color:#e9f2b8;font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:22px 12px}.wrap{width:min(100%,470px)}h1{text-align:center;letter-spacing:3px;margin:5px 0 14px;color:#d8f25b}.stats{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:800}.scr{position:relative;margin:auto;width:min(100%,360px);aspect-ratio:1;border:7px solid #425b1d;border-radius:12px;background:#b5d62b;box-shadow:0 12px 40px #0008}.scr canvas{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}.mute{position:absolute;right:8px;top:8px;z-index:5;background:#18260b;color:white;border:0;border-radius:8px;padding:7px;cursor:pointer}.overlay{position:absolute;inset:0;background:#17210ee8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px;text-align:center;z-index:3}.overlay h2{margin:0;color:#e8fa77}.overlay input{padding:12px;border:2px solid #8ba733;border-radius:8px;width:90%;font:inherit}.overlay button,.pad button{cursor:pointer;border:0;border-radius:9px;background:#d9f357;color:#17210e;font-weight:900;font-size:17px;padding:12px 22px}.hide{display:none!important}.pad{display:grid;grid-template-columns:repeat(3,62px);gap:7px;justify-content:center;margin:17px auto}.pad button{padding:10px}.pad [data-d=u]{grid-column:2}.pad [data-d=l]{grid-column:1;grid-row:2}.pad [data-d=d]{grid-column:2;grid-row:2}.pad [data-d=r]{grid-column:3;grid-row:2}.help{text-align:center;color:#b8c69b;font-size:13px}.leaderboard{margin-top:20px;background:#243618;border:1px solid #526c32;border-radius:12px;padding:15px}.leaderboard h2{margin:0 0 8px;font-size:19px}.leaderboard #lb>div{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #42552c}#lbnote{font-size:12px;color:#b5c797}.n{overflow-wrap:anywhere}
</style></head><body><main class="wrap"><h1>🐍 4TH PLACE</h1><div class="stats"><span>SCORE: <span id="sc">0</span></span><span>BEST: <span id="bs">0</span></span></div><div class="scr"><canvas id="c" width="360" height="360"></canvas><div class="overlay" id="start"><h2>READY TO PLAY?</h2><p>Enter your name to start</p><input id="nm" maxlength="20" placeholder="Player name" autocomplete="nickname"><button id="go">▶ PLAY</button></div><div class="overlay hide" id="over"><h2>GAME OVER</h2><p id="res"></p><button id="again">↻ PLAY AGAIN</button></div></div><div class="pad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div><p class="help">Use arrow keys / WASD, swipe, or the buttons. Giant food starts Dual Snake; chocolate and every 7th food can start Three-Headed Mode.</p><section class="leaderboard"><h2>🏆 LEADERBOARD</h2><p id="lbnote">Loading leaderboard…</p><div id="lb"></div></section></main><script src="game.js" defer></script></body></html>
